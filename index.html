function syncAttrs(a,b){
  for(const at of [...a.attributes])if(!b.hasAttribute(at.name))a.removeAttribute(at.name);
  for(const at of b.attributes)if(a.getAttribute(at.name)!==at.value){
    a.setAttribute(at.name,at.value);
    if(at.name==='value'&&(a.tagName==='INPUT'||a.tagName==='SELECT')&&a!==document.activeElement)a.value=at.value;
  }
}
function morph(a,b){
  syncAttrs(a,b);
  const t=a.tagName;
  if(t==='INPUT'&&(a.type==='checkbox'||a.type==='radio')){a.checked=b.hasAttribute('checked');return}
  if(t==='TEXTAREA'){const v=b.textContent;if(a.dataset.tv!==v){a.dataset.tv=v;if(a!==document.activeElement)a.value=v}return}
  if(t==='INPUT')return;
  morphKids(a,b);
  if(t==='SELECT'){const o=b.querySelector('option[selected]');if(o&&a!==document.activeElement)a.value=o.getAttribute('value')}
}
function upd(na,nb){
  if(na.nodeType===1){if(na.hasAttribute('data-keep'))syncAttrs(na,nb);else morph(na,nb)}
  else if(na.nodeValue!==nb.nodeValue)na.nodeValue=nb.nodeValue;
}
function morphKids(a,b){
  const kept=new Set(),pool=new Map();
  for(const n of a.childNodes)if(n.nodeType===1&&n.dataset&&n.dataset.k)pool.set(n.dataset.k,n);
  let ptr=a.firstChild;
  for(const nb of [...b.childNodes]){
    while(ptr&&kept.has(ptr))ptr=ptr.nextSibling;
    let na=null;const k=nb.nodeType===1&&nb.dataset?nb.dataset.k:null;
    if(k){na=pool.get(k)||null;pool.delete(k)}
    else{
      let c=ptr;
      while(c&&(kept.has(c)||(c.nodeType===1&&c.dataset&&c.dataset.k)))c=c.nextSibling;
      if(c&&c.nodeType===nb.nodeType&&(nb.nodeType!==1||c.tagName===nb.tagName))na=c;
    }
    if(na)upd(na,nb);else na=nb.cloneNode(true);
    if(na!==ptr)a.insertBefore(na,ptr);else ptr=ptr.nextSibling;
    kept.add(na);
  }

}

const NUMW={zero:0,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12,thirteen:13,fourteen:14,fifteen:15,sixteen:16,seventeen:17,eighteen:18,nineteen:19,twenty:20};
function canon(s){
  let x=String(s??'').toLowerCase().replace(/[‘’`´]/g,"'").replace(/[–—]/g,'-').replace(/\s+/g,' ').trim();
  x=x.replace(/(\d),(?=\d{3}\b)/g,'$1').replace(/[^\p{L}\p{N}\s'\-%$£.\/&]/gu,'').replace(/\.+$/,'').replace(/\s+/g,' ').trim();
  return x.split(' ').map(w=>NUMW[w]!==undefined?String(NUMW[w]):w).join(' ');
}
const TFW={t:'true',f:'false',ng:'not given',y:'yes',n:'no'};
function eqAns(u,k){
  u=canon(u);k=canon(k);if(!u)return false;if(u===k)return true;
  if(/^(true|false|not given|yes|no)$/.test(k)){const m=TFW[u];if(m===k)return true;if(k==='not given'&&u.replace(/[\s-]/g,'')==='notgiven')return true}
  return false;
}
function parseVariants(raw){
  // "(the) market / marketplace" -> ["the market","market","marketplace"]
  const out=[];
  for(const part of String(raw).split(/\s*(?:\/|\||;|\bOR\b)\s*/)){
    const p=part.trim();if(!p)continue;
    const m=p.match(/\(([^)]+)\)/);
    if(m){out.push(p.replace(/\s*\([^)]*\)\s*/g,' ').replace(/\s+/g,' ').trim());out.push(p.replace(/[()]/g,'').replace(/\s+/g,' ').trim())}
    else out.push(p);
  }
  return [...new Set(out.filter(Boolean))];
}
function gradeOne(user,variants){

}

/* patch a document (deep merge). replace:true writes the whole doc. */
function save(path,patch,o={}){
  const had=S.docs[path]!==undefined;
  S.docs[path]=o.replace?patch:deepMerge(S.docs[path]||{},patch);
  S.rev++;render();

  const full=S.docs[path];
  return enqueue(path,async()=>{try{const ref=DB.db.doc(path);if(o.replace||!had)await ref.set(full);else await ref.update(patch)}catch(e){writeErr(e,path)}});
}

function subscribe(path,build){
  return new Promise(res=>{
    let first=true;const done=()=>{if(first){first=false;res()}};
    const q=build?build(DB.db.collection(path)):DB.db.collection(path);
    const un=q.onSnapshot(snap=>{
      for(const ch of snap.docChanges()){const k=path+'/'+ch.doc.id;if(ch.type==='removed')delete S.docs[k];else S.docs[k]=ch.doc.data()}
      S.rev++;done();render();if(path==='members')loadProfiles();
    },err=>{console.warn('sub',path,err&&err.code);done()});
    DB.subs.push(un);
    setTimeout(done,9000);
  });
}

function ring(p,size=72,sw=7,inner=''){
  const r=(size-sw)/2,c=2*Math.PI*r,h=size/2;
  return '<div style="position:relative;width:'+size+'px;height:'+size+'px;flex:none"><svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'" style="transform:rotate(-90deg)" aria-hidden="true"><circle cx="'+h+'" cy="'+h+'" r="'+r+'" fill="none" stroke="var(--surf3)" stroke-width="'+sw+'"/><circle cx="'+h+'" cy="'+h+'" r="'+r+'" fill="none" stroke="var(--gold)" stroke-width="'+sw+'" stroke-linecap="round" stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+(c*(1-clamp(p,0,100)/100)).toFixed(1)+'" style="transition:stroke-dashoffset .6s"/></svg><div class="num" style="position:absolute;inset:0;display:grid;place-items:center;font-size:'+Math.round(size/3)+'px">'+inner+'</div></div>';
}
function rich(t){
  const f=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|\s)_(.+?)_(?=\s|$|[.,;:!?])/g,'$1<i>$2</i>');
  let out='',inl=false;
  for(const ln of String(t||'').split('\n')){
    const m=ln.match(/^\s*[-•]\s+(.*)/);
    if(m){if(!inl){out+='<ul>';inl=true}out+='<li>'+f(m[1])+'</li>'}
    else{if(inl){out+='</ul>';inl=false}if(ln.trim())out+='<p>'+f(ln)+'</p>'}
  }
  return '<div class="md">'+out+(inl?'</ul>':'')+'</div>';
}

const SCL=['--m1','--m2','--m3','--info','--ok','--warn','--bad'];
function niceStep(x){if(x<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(x))),f=x/p;return(f<=1?1:f<=2?2:f<=5?5:10)*p}
function legend(names){return names.length>1?'<div class="row wrap g8 xs mut" style="margin-top:6px">'+names.map((n,i)=>'<span class="row g4"><i style="width:9px;height:9px;border-radius:50%;background:var('+SCL[i%7]+')"></i>'+esc(n)+'</span>').join('')+'</div>':''}
function chart(o){
  const{type='line',labels=[],series=[],unit='',w=340,h=200}=o;
  if(type==='pie'){
    const vals=series[0].v,tot=sum(vals),cx=w/2,cy=h/2-6,r=Math.min(cx,cy)-14;let a=-Math.PI/2,s='';
    vals.forEach((v,i)=>{
      const a2=a+2*Math.PI*v/tot,lg=a2-a>Math.PI?1:0,x1=cx+r*Math.cos(a),y1=cy+r*Math.sin(a),x2=cx+r*Math.cos(a2),y2=cy+r*Math.sin(a2),m=(a+a2)/2;
      s+='<path d="M'+cx+' '+cy+' L'+x1.toFixed(1)+' '+y1.toFixed(1)+' A'+r+' '+r+' 0 '+lg+' 1 '+x2.toFixed(1)+' '+y2.toFixed(1)+'Z" fill="var('+SCL[i%7]+')" stroke="var(--surf)" stroke-width="2"/>';
      s+='<text x="'+(cx+(r*.62)*Math.cos(m)).toFixed(1)+'" y="'+(cy+(r*.62)*Math.sin(m)+4).toFixed(1)+'" text-anchor="middle" style="fill:var(--on-gold);font-weight:700;font-size:11px">'+Math.round(100*v/tot)+'%</text>';a=a2;
    });
    return '<svg class="ch" viewBox="0 0 '+w+' '+h+'" role="img" aria-label="Pie chart">'+s+'</svg>'+legend(labels);
  }
  const L=40,R=12,T=14,B=28,iw=w-L-R,ih=h-T-B,all=series.flatMap(s=>s.v.filter(x=>x!=null));
  let lo=o.yMin??Math.min(0,...all),hi=o.yMax??Math.max(...all);const st=niceStep((hi-lo)/4);lo=Math.floor(lo/st)*st;hi=Math.ceil(hi/st)*st;if(hi===lo)hi=lo+st;
  const Y=v=>T+ih-(v-lo)/(hi-lo)*ih;let g='';
  for(let v=lo;v<=hi+1e-9;v+=st)g+='<line class="gl" x1="'+L+'" x2="'+(w-R)+'" y1="'+Y(v).toFixed(1)+'" y2="'+Y(v).toFixed(1)+'"/><text x="'+(L-6)+'" y="'+(Y(v)+3.5).toFixed(1)+'" text-anchor="end">'+(Math.round(v*100)/100)+'</text>';
  const n=labels.length,every=Math.ceil(n/7);let s='';
  if(type==='bar'){
    const gw=iw/n,k=series.length,bw=Math.min(26,(gw*.72)/k);
    labels.forEach((lb,i)=>{
      series.forEach((se,j)=>{const v=se.v[i];if(v==null)return;const x=L+gw*i+gw/2-(bw*k)/2+j*bw,y=Y(Math.max(v,lo));s+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+(bw-2).toFixed(1)+'" height="'+Math.max(1,Y(lo)-y).toFixed(1)+'" rx="3" fill="var('+SCL[j%7]+')"/>'});
      if(i%every===0)s+='<text x="'+(L+gw*i+gw/2).toFixed(1)+'" y="'+(h-9)+'" text-anchor="middle">'+esc(lb)+'</text>';
    });
  }else{
    const X=i=>L+(n>1?iw*i/(n-1):iw/2);
    series.forEach((se,j)=>{
      const pts=se.v.map((v,i)=>v==null?null:[X(i),Y(v)]).filter(Boolean);
      s+='<path class="ln" d="'+pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ')+'" stroke="var('+SCL[j%7]+')"/>';
      const e=pts[pts.length-1];if(e)s+='<circle cx="'+e[0].toFixed(1)+'" cy="'+e[1].toFixed(1)+'" r="3.8" fill="var('+SCL[j%7]+')" stroke="var(--surf)" stroke-width="2"/>';
    });
    labels.forEach((lb,i)=>{if(i%every===0)s+='<text x="'+X(i).toFixed(1)+'" y="'+(h-9)+'" text-anchor="middle">'+esc(lb)+'</text>'});
  }
  const u=unit?'<text x="'+L+'" y="9" style="font-size:10px">'+esc(unit)+'</text>':'';
  return '<svg class="ch" viewBox="0 0 '+w+' '+h+'" role="img" aria-label="'+esc(o.title||'Chart')+'">'+g+u+s+'</svg>'+legend(series.map(x=>x.name||''));
}
function spark(vals,w=110,h=34){
  const v=vals.filter(x=>x!=null);if(v.length<2)return '';
  const lo=Math.min(...v),hi=Math.max(...v),r=hi-lo||1,P=v.map((x,i)=>[2+i*(w-4)/(v.length-1),h-4-(x-lo)/r*(h-10)]);
  return '<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" aria-hidden="true"><path d="'+P.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ')+'" fill="none" stroke="var(--gold)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="'+P[P.length-1][0].toFixed(1)+'" cy="'+P[P.length-1][1].toFixed(1)+'" r="3" fill="var(--gold)"/></svg>';
}

{id:'perfect',t:'Present perfect vs past simple',id_:'Present perfect nyambung ke sekarang; past simple untuk waktu yang sudah selesai.',why:'Task 1 trends and Task 2 examples both need the right tense.',
 rules:[['Present perfect = have/has + past participle','Use it for change up to now, experience, and results that still matter.','Internet use has risen sharply since 2010.'],['Past simple','Use it with a finished time: in 2015, last year, three days ago.','Sales fell in 2019.'],['since / for','since + a point in time, for + a length of time.','She has studied English for two years / since 2024.']],
 q:[['Smartphone sales ___ steadily since 2015.',['rise','rose','have risen','had risen'],2,'"since" links the past to now, so use the present perfect.'],['The company ___ 200 workers last March.',['has hired','hired','have hired','is hiring'],1,'"last March" is a finished time.'],['I ___ abroad before, so the first year will be hard.',['never travel','have never travelled','never travelled','am never travelling'],1,'Experience up to now: present perfect.'],['How long ___ you ___ English?',['did / study','have / studied','are / studying','do / study'],1,'"How long" with an unfinished period takes the present perfect.'],['Between 1990 and 2000 the population ___ by 20%.',['has grown','grew','have grown','grows'],1,'A finished period in the past takes the past simple.']]},
{id:'articles',t:'Articles: a, an, the, or none',id_:'Kata benda umum jamak/tak terhitung biasanya tanpa artikel.',why:'Article errors are among the most common slips in Writing.',
 rules:[['a / an','First mention of a singular countable noun.','She bought a laptop.'],['the','Something specific, already mentioned, unique, or a superlative.','The laptop was expensive. It is the best option.'],['no article','General plural or uncountable nouns; most countries and languages.','Education is essential. Many people prefer public transport.']],
 q:[['___ education is essential for development.',['The','A','(no article)','An'],2,'Education in general takes no article.'],['She bought ___ laptop. ___ laptop was expensive.',['a / The','the / The','a / A','(none) / The'],0,'First mention: a. Second mention: the.'],['___ Netherlands has ___ high population density.',['Netherlands / a','The Netherlands / a','The Netherlands / the','Netherlands / the'],1,'"The Netherlands" is plural in form; density is described with "a high ...".'],['It is ___ most effective solution.',['a','an','the','(no article)'],2,'Superlatives take "the".'],['Many people prefer ___ public transport to cars.',['the','a','an','(no article)'],3,'General statement about public transport.']]},
{id:'relative',t:'Relative clauses',id_:'who = orang, which = benda, whose = kepunyaan, where = tempat.',why:'They let you add detail in one sentence and lift your grammar range.',
 rules:[['who / which / that','who for people, which for things, that for either in defining clauses.','Students who attend lectures score higher.'],['whose','Shows possession.','A scientist whose research was funded by the state...'],['Non-defining clauses','Extra information, set off by commas. Never use "that".','The report, which was published in 2021, changed policy.'],['where / when','Place and time.','The town where I grew up is now a tourist hub.']],
 q:[['Students ___ attend lectures regularly usually score higher.',['which','who','whose','where'],1,'People: who.'],['The report, ___ was published in 2021, changed policy.',['that','who','which','what'],2,'Non-defining clause with commas: which.'],['A scientist ___ research was funded by the state published the results.',['who','whose','which','that'],1,'Possession: whose.'],['The town ___ I grew up is now a tourist hub.',['where','which','who','whose'],0,'Place: where.'],['The book ___ I borrowed was fascinating.',['who','whose','that','where'],2,'Defining clause about a thing: that / which.']]},
{id:'cond',t:'Conditionals',id_:'If + past, would = hal tak nyata sekarang. If + past perfect, would have = penyesalan masa lalu.',why:'Task 2 solutions and speaking Part 3 both lean on conditionals.',
 rules:[['Zero','If + present, present. General truths.','If you heat water to 100°C, it boils.'],['First','If + present, will. Real future.','If prices rise, fewer people will buy cars.'],['Second','If + past, would. Unreal or unlikely.','If governments raised fuel tax, more people would cycle.'],['Third','If + past perfect, would have + past participle. Unreal past.','If she had revised more, she would have got a higher band.'],['Alternatives','unless = if not; provided that; as long as.','Unless the cost falls, few will buy electric cars.']],
 q:[['If governments ___ fuel prices, more people would cycle.',['raise','raised','will raise','had raised'],1,'Second conditional: if + past simple.'],['If you heat water to 100°C, it ___.',['boiled','boils','would boil','will have boiled'],1,'Zero conditional.'],['If she had revised more, she ___ a higher band.',['would get','would have got','will get','got'],1,'Third conditional.'],['___ the cost falls, few people will buy electric cars.',['If','Unless','Provided','Although'],1,'unless = if not.'],['If I ___ you, I would book the test earlier.',['am','was','were','will be'],2,'"If I were you" is the fixed advice form.']]},
{id:'passive',t:'Passive voice',id_:'be + V3. Dipakai kalau pelaku tidak penting atau tidak diketahui.',why:'Useful for processes and for formal, objective Task 1 and Task 2 style.',

 q:[['The bridge ___ in 1998.',['built','was built','has built','is building'],1,'Past simple passive.'],['Plastic waste ___ in landfill sites every year.',['dumps','is dumped','dumped','are dumped'],1,'Uncountable "waste" takes a singular verb: is dumped.'],['More schools ___ if funding increases.',['will build','will be built','are built','build'],1,'Future passive.'],['A new vaccine ___ recently.',['has developed','has been developed','was developing','had develop'],1,'Present perfect passive.'],['Which sentence is correct?',['The data was collected by researchers.','The data collected by researchers was.','The data is collecting by researchers.','The data has collect by researchers.'],0,'Past simple passive with a clear subject.']]},
{id:'compare',t:'Comparatives and superlatives',id_:'Short adjective + -er; panjang pakai more. The more..., the more...',why:'Needed in nearly every Task 1 and for Part 3 speaking comparisons.',
 rules:[['-er / more','Short adjectives take -er, long ones take more.','cheaper, more expensive'],['the ... the ...','Two changes that go together.','The more the population grows, the greater the pressure.'],['Modifiers','slightly, considerably, far, much, by far.','Prices are slightly higher than in rural areas.'],['as ... as','Equal or unequal comparison.','Online study is not as effective as classes for some people.']],
 q:[['Public transport is ___ than driving in large cities.',['more cheap','cheaper','cheapest','the cheaper'],1,'Short adjective: cheaper.'],['Rail travel is ___ the most environmentally friendly option.',['by far','much','very','more'],0,'"by far the most" strengthens a superlative.'],['The ___ the population grows, the ___ the pressure on housing.',['more rapidly / greater','more rapid / greater','most rapidly / greatest','more rapidly / great'],0,'The + comparative, the + comparative.'],['Prices in the capital are slightly ___ those in rural areas.',['higher than','more high than','highest than','as high'],0,'Comparative + than.'],['Online learning is not ___ effective ___ classroom teaching for some students.',['so / as','as / than','more / as','very / like'],0,'not so/as ... as.']]},
{id:'linking',t:'Linking words',id_:'although + klausa; despite + kata benda/-ing; however berdiri sendiri.',why:'Cohesion is a quarter of your Writing score.',

{id:'agree',t:'Uncountable nouns and agreement',id_:'information, advice, research, evidence = tak pakai -s. The number of = tunggal.',why:'Agreement slips cost marks in Grammatical Range and Accuracy.',

{id:'gerund',t:'-ing or to + verb?',id_:'avoid, enjoy, suggest + -ing. decide, plan, aim + to. Setelah preposisi selalu -ing.',why:'Wrong verb patterns show up fast in Speaking.',

 q:[['Many students avoid ___ questions in class.',['to ask','asking','ask','asked'],1,'avoid + -ing.'],['The government plans ___ new railways.',['building','to build','build','built'],1,'plan + to infinitive.'],['She is looking forward to ___ abroad.',['study','studying','to study','studied'],1,'"to" is a preposition here, so -ing follows.'],['Exercise is a good way of ___ stress.',['reduce','to reduce','reducing','reduced'],2,'After a preposition: -ing.'],['We decided ___ the survey online.',['conducting','to conduct','conduct','conducted'],1,'decide + to infinitive.']]},

const isDone=id=>!!(me().done&&me().done[id]);
function markDone(id,on=true){save('members/'+S.uid,{done:{[id]:on?Date.now():0}})}
function autoMark(fn){const t=tasksOn(dkey()).find(x=>!isDone(x.id)&&fn(x.act));if(t){markDone(t.id);dayCheck();return t}return null}
function dayCheck(){const ts=tasksOn(dkey());if(ts.length&&ts.every(t=>isDone(t.id)||t.id===undefined))logEvent('plan','finished all of today’s plan');}
A.tick=d=>{const on=!isDone(d.id);markDone(d.id,on);addMinutes(on?+d.mins:-(+d.mins));if(on)dayCheck()};
A.launch=d=>{const t=tasksOn(dkey()).concat(S.v.planTasks||[]).find(x=>x.id===d.id);if(t)launchAct(t.act,t.id)};
function launchAct(a,from){
  if(a.go==='test')return startRun({bk:a.bk,t:a.t,m:a.m,parts:a.parts,from});
  if(a.go==='vocab')return startVocab({from});
  if(a.go==='grammar')return openLesson(a.id,from);
  if(a.go==='write')return openWriting(a.kind,a.pid,from);

  if(a.go==='review')return push('review');
}

const IDB={db:null,
  open(){if(this.db)return this.db;return this.db=new Promise((res,rej)=>{if(!window.indexedDB)return rej(new Error('no idb'));const q=indexedDB.open('meridian',1);q.onupgradeneeded=()=>{q.result.createObjectStore('blob');q.result.createObjectStore('meta')};q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})},
  async tx(store,mode,fn){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction(store,mode),r=fn(t.objectStore(store));t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})},
  async put(k,blob,meta){await this.tx('blob','readwrite',s=>s.put(blob,k));await this.tx('meta','readwrite',s=>s.put(meta,k))},
  get(k){return this.tx('blob','readonly',s=>s.get(k))},
  async del(k){await this.tx('blob','readwrite',s=>s.delete(k));await this.tx('meta','readwrite',s=>s.delete(k))},
  async all(){const db=await this.open();return new Promise(res=>{const out={},c=db.transaction('meta','readonly').objectStore('meta').openCursor();c.onsuccess=()=>{const cur=c.result;if(cur){out[cur.key]=cur.value;cur.continue()}else res(out)};c.onerror=()=>res(out)})}
};
function parseKey(text){
  const a={},g=[];
  for(let ln of String(text||'').split(/\r?\n/)){
    ln=ln.replace(/[–—]/g,'-').trim();if(!ln)continue;
    let m=ln.match(/^(?:q(?:uestions?)?\.?\s*)?(\d{1,2})\s*(?:[-&,]|and)\s*(\d{1,2})\s*[:.)=-]?\s+(.+)$/i);
    if(m&&+m[2]>+m[1]&&+m[2]-+m[1]<=3&&+m[2]<=40){
      const vs=m[3].split(/\s*(?:,|\/|&|\band\b|\bor\b|\|)\s*/i).map(s=>s.trim()).filter(Boolean);
      for(let q=+m[1];q<=+m[2];q++)a[q]=vs;g.push(m[1]+'-'+m[2]);continue;
    }
    m=ln.match(/^(?:q(?:uestions?)?\.?\s*)?(\d{1,2})\s*[:.)=-]?\s+(.+)$/i);
    if(m&&+m[1]>=1&&+m[1]<=40){const v=parseVariants(m[2]);if(v.length)a[+m[1]]=v}
  }
  return{a,g};
}

    try{await IDB.put(k,f,{name:f.name,size:f.size,bk,t:+m[1],p:+m[2]});S.audio[k]={name:f.name,size:f.size,bk,t:+m[1],p:+m[2]};ok++}catch(e){bad.push(f.name)}
  }
  S.v.audioMsg='Imported '+ok+' file'+(ok===1?'':'s')+(bad.length?'. Could not use: '+bad.join(', '):'.');render();

/* ===== vocabulary (spaced repetition) and grammar ===== */
const srs=()=>mine('srs');
const deck=()=>VOCAB.concat((srs().custom||[]).map(c=>({p:'',c:'',...c,t:'my'})));
const cardOf=id=>((srs().cards||{})[id])||null;
const wById=id=>deck().find(w=>w.id===id);
const vocabDue=()=>{const k=dkey(),c=srs().cards||{};return deck().filter(w=>c[w.id]&&c[w.id].due<=k)};
const vocabNew=(lim=8)=>{const c=srs().cards||{},used=((srs().nw)||{})[dkey()]||0;return deck().filter(w=>!c[w.id]).sort((a,b)=>seeded(S.uid+a.id)()-seeded(S.uid+b.id)()).slice(0,Math.max(0,lim-used))};
const vstat=w=>{const c=cardOf(w.id);return!c?'new':c.iv>=21?'mastered':c.due<=dkey()?'due':'learning'};
const POS={n:'noun',v:'verb',adj:'adjective',adv:'adverb'};const posN=p=>POS[p]||p;
const hl=(s,w)=>esc(s).replace(new RegExp('\\b('+w.replace(/[^a-z\- ]/gi,'')+'\\w*)','i'),'<span class="hl">$1</span>');
function nextIv(c,g){c=c||{n:0,ef:2.5,iv:0,l:0};let{n,ef,iv,l}=c;
  if(g===0){n=0;iv=0;l=(l||0)+1;ef=Math.max(1.3,ef-.2)}else if(g===1){iv=Math.max(1,Math.round(iv*1.2));ef=Math.max(1.3,ef-.15);n++}else if(g===2){iv=n===0?1:n===1?3:Math.round(iv*ef);n++}else{iv=n===0?3:Math.round(Math.max(iv,1)*ef*1.3);ef+=.1;n++}
  return{n,ef:Math.round(ef*100)/100,iv,l:l||0,due:g===0?dkey():addDays(dkey(),iv)}}
const ivLabel=iv=>iv<=0?'now':iv===1?'1 day':iv<30?iv+' days':Math.round(iv/30)+' mo';
A.say=d=>{try{const u=new SpeechSynthesisUtterance(d.w);u.lang='en-GB';u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)}catch{}};

SCR.vocab=()=>{
  const dk=deck(),c=srs().cards||{},due=vocabDue().length,nw=vocabNew().length,lrn=dk.filter(w=>c[w.id]).length,mas=dk.filter(w=>vstat(w)==='mastered').length;
  return '<div class="view col g16">'+topbar('Vocabulary')+
  '<div class="card hero"><div class="row g16">'+ring(pct(lrn,dk.length),78,8,lrn)+'<div class="grow"><div class="eyebrow">Today</div><div class="t2" style="margin:4px 0 4px">'+due+' due \u00b7 '+nw+' new</div><div class="xs mut">'+lrn+' of '+dk.length+' words started \u00b7 '+mas+' mastered</div></div></div><button class="btn pri block mt16" data-a="vstart">'+ic('cards',18)+' Start today\u2019s session</button></div>'+
  '<div class="grid2"><button class="card tap" style="text-align:left" data-a="vquiz" data-v="mc">'+modIcon('V',20)+'<div class="t3 mt8">Meaning quiz</div><div class="xs mut">10 quick questions</div></button><button class="card tap" style="text-align:left" data-a="vquiz" data-v="cloze">'+modIcon('W',20)+'<div class="t3 mt8">Fill the gap</div><div class="xs mut">Type the missing word</div></button></div>'+
  '<div class="row g8"><button class="btn block" data-a="vlist">'+ic('list',18)+' Browse words</button><button class="btn block" data-a="vadd">'+ic('plus',18)+' Add your own</button></div></div>';
};

  if(!q.length){toast('All caught up for today. Try a quiz.');return push('vocab')}

}

SCR.flash=()=>{
  const f=S.v.fc;if(!f)return '<div class="view">'+topbar('Session')+'</div>';
  if(f.fin)return '<div class="view col g16">'+topbar('Session complete')+'<div class="card hero tc col g8"><div class="t1">'+f.done+'<span class="dim" style="font-size:22px"> cards</span></div><p class="sm mut" style="margin:0">Reviewed in '+Math.max(1,Math.round((Date.now()-f.t0)/60000))+' min. Cards you missed will return today.</p></div><button class="btn pri block" data-a="vfinish">Done</button></div>';
  const w=wById(f.q[f.i]);if(!w){f.fin=true;return SCR.flash()}

  const face=f.flip?'<div class="face" data-a="vflip"><div class="eyebrow">'+esc(w.p)+'</div><div class="t2">'+esc(w.w)+'</div><div class="sm" style="max-width:30ch">'+esc(w.d)+'</div><div class="mut sm" style="max-width:34ch;font-style:italic">'+(w.e?hl(w.e,w.w):'')+'</div>'+(w.i?'<div class="pill gold">'+esc(w.i)+'</div>':'')+(w.c?'<div class="xs dim">'+esc(w.c)+'</div>':'')+'</div>'
   :'<div class="face" data-a="vflip"><div class="eyebrow">'+(c?'review':'new word')+' \u00b7 '+esc(posN(w.p))+'</div><div class="word">'+esc(w.w)+'</div><button class="btn sm ghost" data-a="say" data-w="'+esc(w.w)+'" aria-label="Hear it">'+ic('speaker',18)+' Hear</button><div class="xs dim">Tap to reveal</div></div>';
  return '<div class="view col g16">'+topbar(f.done+' of '+f.q.length,'<span class="xs mut mono">'+VOCAB.length+' words</span>')+bar(pct(f.done,f.q.length))+'<div class="fc" data-k="fc-'+f.i+'-'+f.done+'">'+face+'</div>'+
  (f.flip?'<div class="grade">'+['Again','Hard','Good','Easy'].map((l,g)=>'<button class="btn '+(g===2?'pri':'')+'" data-a="vgrade" data-g="'+g+'">'+l+'<small>'+ivLabel(nextIv(c,g).iv)+'</small></button>').join('')+'</div>':'<button class="btn pri block" data-a="vflip">Show answer</button>')+'</div>';
};
A.vflip=()=>{S.v.fc.flip=true;render()};
A.vgrade=d=>{
  const f=S.v.fc,id=f.q[f.i],g=+d.g,had=cardOf(id),nx=nextIv(had,g),nwc=((srs().nw)||{})[dkey()]||0;
  save(myp('srs'),{cards:{[id]:{n:nx.n,ef:nx.ef,iv:nx.iv,due:nx.due,l:nx.l}},...(had?{}:{nw:{[dkey()]:nwc+1}})});
  if(g===0&&(f.ag[id]||0)<2){f.ag[id]=(f.ag[id]||0)+1;f.q.push(id)}
  f.done++;f.i++;f.flip=false;if(f.i>=f.q.length)f.fin=true;render();
};
A.vfinish=()=>{const f=S.v.fc;addMinutes(Math.max(1,Math.round((Date.now()-f.t0)/60000)));if(f.from)markDone(f.from);else autoMark(x=>x.go==='vocab');logEvent('vocab','reviewed '+f.done+' vocabulary cards');S.v.fc=null;S.stack=[];S.tab='learn';S.scroll=true;render()};

/* quizzes */
A.vquiz=d=>{
  const dk=deck(),c=srs().cards||{},mode=d.v;
  const pool=dk.filter(w=>mode==='cloze'?new RegExp('\\b'+w.w.replace(/[^a-z\- ]/gi,'')+'\\w*','i').test(w.e||''):true);
  const pri=pool.filter(w=>c[w.id]&&c[w.id].due<=dkey()),rest=shuffle(pool.filter(w=>!pri.includes(w)));
  const pick=[...shuffle(pri),...rest].slice(0,10);
  S.v.qz={mode,i:0,sc:0,sel:null,typed:'',hint:false,res:[],items:pick.map(w=>{
    if(mode==='cloze'){const re=new RegExp('\\b'+w.w.replace(/[^a-z\- ]/gi,'')+'\\w*','i'),m=w.e.match(re);return{id:w.id,stem:w.e.replace(re,'_____'),form:m[0]}}
    const same=dk.filter(x=>x.id!==w.id&&x.p===w.p),oth=shuffle(same.length>=3?same:dk.filter(x=>x.id!==w.id)).slice(0,3);
    return{id:w.id,opts:shuffle([w,...oth]).map(x=>x.id)};
  }),t0:Date.now()};push('quiz');
};
SCR.quiz=()=>{
  const q=S.v.qz;if(!q)return '<div class="view">'+topbar('Quiz')+'</div>';
  if(q.i>=q.items.length){
    return '<div class="view col g16">'+topbar('Quiz result')+'<div class="card hero tc col g8"><div class="t1">'+q.sc+'<span class="dim" style="font-size:24px">/'+q.items.length+'</span></div><p class="sm mut" style="margin:0">'+(q.sc===q.items.length?'Perfect round.':'Missed words come back in your next session.')+'</p></div>'+
    (q.res.some(x=>!x.ok)?'<div class="card" style="padding:4px 16px"><div class="list">'+q.res.filter(x=>!x.ok).map(x=>{const w=wById(x.id);return '<div class="li" data-a="vword" data-id="'+w.id+'"><div class="grow"><div class="t3" style="font-size:15px">'+esc(w.w)+'</div><div class="xs mut">'+esc(w.d)+'</div></div></div>'}).join('')+'</div></div>':'')+'<button class="btn pri block" data-a="vqdone">Done</button></div>';
  }
  const it=q.items[q.i],w=wById(it.id),ans=q.sel!==null;let body;
  if(q.mode==='cloze'){
    const ok=ans&&q.ok;
    body='<div class="card"><div class="eyebrow">Fill the gap</div><div class="t2" style="margin:8px 0 12px;font-size:22px">'+esc(it.stem)+'</div><div class="sm mut">'+esc(w.d)+'</div>'+(q.hint?'<div class="xs gold mt8">Starts with "'+esc(w.w[0])+'", '+w.w.length+' letters</div>':'')+'</div>'+
    '<input class="inp" id="cz" data-i="cztype" data-enter="'+(ans?'vqnext':'vqcheck')+'" value="'+esc(q.typed)+'" placeholder="Type the word" autocomplete="off" autocapitalize="off" spellcheck="false" '+(ans?'disabled':'')+'>'+
    (ans?'<div class="card soft '+(ok?'':'')+'"><b class="'+(ok?'ok':'bad')+'">'+(ok?'Correct':'Not quite')+'</b> <span class="sm">The word is <b>'+esc(it.form)+'</b>.</span></div><button class="btn pri block" data-a="vqnext">Next</button>':'<div class="row g8"><button class="btn ghost" data-a="vqhint">Hint</button><button class="btn pri grow" data-a="vqcheck">Check</button></div>');
  }else{
    body='<div class="card"><div class="eyebrow">Which word matches?</div><div class="t2" style="margin:8px 0 0;font-size:22px">'+esc(w.d)+'</div></div><div class="col g8">'+it.opts.map(id=>{const o=wById(id),cls=!ans?'':id===it.id?'ok':q.sel===id?'bad':'';return '<button class="btn block" style="justify-content:flex-start;'+(cls==='ok'?'border-color:var(--ok);color:var(--ok)':cls==='bad'?'border-color:var(--bad);color:var(--bad)':'')+'" data-a="vqpick" data-id="'+id+'" '+(ans?'disabled':'')+'>'+esc(o.w)+'</button>'}).join('')+'</div>'+
    (ans?'<div class="card soft sm">'+(w.e?hl(w.e,w.w):'')+'</div><button class="btn pri block" data-a="vqnext">Next</button>':'');
  }
  return '<div class="view col g16">'+topbar('Question '+(q.i+1)+' of '+q.items.length)+bar(pct(q.i,q.items.length))+body+'</div>';
};
function vqRecord(ok){
  const q=S.v.qz,it=q.items[q.i];q.res.push({id:it.id,ok});if(ok)q.sc++;
  if(!ok){const had=cardOf(it.id);save(myp('srs'),{cards:{[it.id]:{n:0,ef:Math.max(1.3,(had?had.ef:2.5)-.2),iv:0,due:dkey(),l:(had?had.l:0)+1}}})}
}
A.vqpick=d=>{const q=S.v.qz;if(q.sel!==null)return;q.sel=d.id;vqRecord(d.id===q.items[q.i].id);render()};
I.cztype=v=>{S.v.qz.typed=v};
A.vqhint=()=>{S.v.qz.hint=true;render()};
A.vqcheck=()=>{const q=S.v.qz,it=q.items[q.i],w=wById(it.id),t=canon(q.typed);if(!t)return;q.ok=t===canon(it.form)||t===canon(w.w);q.sel=t;vqRecord(q.ok);render()};
A.vqnext=()=>{const q=S.v.qz;q.i++;q.sel=null;q.typed='';q.hint=false;q.ok=false;if(q.i>=q.items.length)addMinutes(Math.max(1,Math.round((Date.now()-q.t0)/60000)));S.focus=q.mode==='cloze'?'cz':null;render()};
A.vqdone=()=>{const q=S.v.qz;logEvent('vocab','scored '+q.sc+'/'+q.items.length+' in a vocabulary quiz');S.v.qz=null;pop()};

function aiCard(ai){
  if(!ai)return '';

  (ai.bands?'<div class="meter" style="grid-template-columns:repeat(4,1fr)">'+['TA','CC','LR','GRA'].map(k=>'<div><b>'+fmtBand(ai.bands[k])+'</b><span>'+k+'</span></div>').join('')+'</div>':'')+
  (ai.summary?'<p class="sm" style="margin:0">'+esc(ai.summary)+'</p>':'')+
  (ai.strengths&&ai.strengths.length?'<div><div class="eyebrow ok">Strengths</div><ul class="sm" style="margin:6px 0 0;padding-left:18px">'+ai.strengths.map(s=>'<li>'+esc(s)+'</li>').join('')+'</ul></div>':'')+
  (ai.fixes&&ai.fixes.length?'<div><div class="eyebrow warn">Fix these</div>'+ai.fixes.map(f=>'<div class="card soft mt8" style="padding:12px"><div class="sm bad" style="text-decoration:line-through">'+esc(f.quote)+'</div><div class="sm ok" style="margin:3px 0">'+esc(f.better)+'</div><div class="xs mut">'+esc(f.why)+'</div></div>').join('')+'</div>':'')+
  (ai.vocab&&ai.vocab.length?'<div><div class="eyebrow">Word upgrades</div><div style="margin-top:6px">'+ai.vocab.map(v=>'<span class="tag">'+esc(v.from)+' → '+esc(v.to)+'</span>').join('')+'</div></div>':'')+
  (ai.next?'<div class="card soft sm"><b>Next time:</b> '+esc(ai.next)+'</div>':'')+'<div class="xs dim">AI estimates are a guide, not an official score.</div></div>';
}

let _recStream=null;
let _recChunks=[];
let _recBlobUrl=null;
let _recState='idle';
let _recTimer=0;
let _recElapsed=0;

async function startVoiceRecord(){
  try{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
      toast('Browser tidak mendukung rekaman suara');
      return;
    }
    _recStream=await navigator.mediaDevices.getUserMedia({audio:true});
    _recChunks=[];
    let mime='';
    if(typeof MediaRecorder!=='undefined'){
      if(MediaRecorder.isTypeSupported('audio/webm;codecs=opus'))mime='audio/webm;codecs=opus';
      else if(MediaRecorder.isTypeSupported('audio/mp4'))mime='audio/mp4';
    }
    _recMedia=mime?new MediaRecorder(_recStream,{mimeType:mime}):new MediaRecorder(_recStream);
    _recMedia.ondataavailable=e=>{if(e.data&&e.data.size>0)_recChunks.push(e.data)};
    _recMedia.onstop=()=>{
      const type=(_recMedia&&_recMedia.mimeType)||'audio/webm';
      const blob=new Blob(_recChunks,{type});
      if(_recBlobUrl)URL.revokeObjectURL(_recBlobUrl);
      _recBlobUrl=URL.createObjectURL(blob);
      _recState='stopped';
      if(_recStream){
        _recStream.getTracks().forEach(t=>t.stop());
        _recStream=null;
      }
      clearInterval(_recTimer);
      render();
    };
    _recMedia.start(250);
    _recState='recording';
    _recElapsed=0;
    clearInterval(_recTimer);
    _recTimer=setInterval(()=>{
      _recElapsed++;
      const el=document.getElementById('rec-clock');
      if(el)el.textContent=fmtT(_recElapsed);
    },1000);
    render();
  }catch(err){
    console.error('Record error:',err);
    toast('Izin mikrofon diperlukan untuk merekam suara');
  }
}

function stopVoiceRecord(){
  if(_recMedia&&_recMedia.state==='recording'){
    _recMedia.stop();
  }
}

function resetVoiceRecord(){
  if(_recStream){
    _recStream.getTracks().forEach(t=>t.stop());
    _recStream=null;
  }
  if(_recMedia&&_recMedia.state==='recording'){
    try{_recMedia.stop()}catch(e){}
  }
  if(_recBlobUrl){
    URL.revokeObjectURL(_recBlobUrl);
    _recBlobUrl=null;
  }
  _recState='idle';
  _recElapsed=0;
  clearInterval(_recTimer);
}

function recorderWidgetHtml(){
  if(typeof navigator==='undefined'||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    return '';
  }
  if(_recState==='idle'){
    return '<div class="card soft row between g12" style="border-radius:14px;padding:12px 14px;margin:10px 0">'+
      '<div class="grow xs"><b style="color:var(--text)">Voice Recorder</b><div class="mut">Rekam respon jawaban speaking kamu untuk didengarkan ulang.</div></div>'+
      '<button class="btn sm pri" data-a="recStart"><span class="ico">'+ic('mic',16)+'</span> Mulai Rekam</button>'+
    '</div>';
  }
  if(_recState==='recording'){
    return '<div class="card row between g12" style="border:1px solid var(--gold);background:rgba(230,126,34,0.08);border-radius:14px;padding:12px 14px;margin:10px 0">'+
      '<div class="row g8"><span class="pill gold sm">Merekam...</span><span id="rec-clock" class="mono b">'+fmtT(_recElapsed)+'</span></div>'+
      '<button class="btn sm" data-a="recStop" style="background:var(--gold);color:#111;border:none;font-weight:700"><span class="ico">'+ic('pause',16)+'</span> Selesai Rekam</button>'+
    '</div>';
  }
  if(_recState==='stopped'&&_recBlobUrl){
    return '<div class="card soft col g8" style="border-radius:14px;padding:12px 14px;margin:10px 0">'+
      '<div class="row between"><b class="xs" style="color:var(--text)">Hasil Rekaman Suara</b><span class="pill ok sm">Tersimpan ('+fmtT(_recElapsed)+')</span></div>'+
      '<audio controls src="'+_recBlobUrl+'" style="width:100%;height:36px;margin:4px 0"></audio>'+
      '<div class="row g8" style="justify-content:flex-end">'+
        '<button class="btn xs ghost" data-a="recReset">Hapus & Rekam Ulang</button>'+
        '<a class="btn xs pri" href="'+_recBlobUrl+'" download="speaking-answer.webm">Unduh Audio</a>'+
      '</div>'+
    '</div>';
  }
  return '';
}

function qCard(s,qs){
  const last=s.qi>=qs.length-1;
  return '<div class="card hero col g12"><div class="row between"><div class="eyebrow">Question '+(s.qi+1)+' of '+qs.length+'</div><span class="pill gold">'+tm(s.t0,s.part===1?30:45)+'</span></div><div class="t2" style="font-size:24px">'+esc(qs[s.qi])+'</div></div>'+
  recorderWidgetHtml()+
  '<div class="row g8"><button class="btn grow" data-a="soagain">Restart timer</button><button class="btn pri grow" data-a="sonext">'+(last?'Finish':'Next')+'</button></div>';
}

A.sonext=()=>{
  resetVoiceRecord();

  s.qi++;s.t0=Date.now();render();
};

function examinerView(lv,rx){
  const st=lv.st,cfg=lv.cfg||(lv.cfg={part:1,tid:SP1[0].id}),cand=LIVE.peers.some(p=>p.presence&&p.presence.role==='candidate');
  const setup='<div class="card col g12"><div class="t3">Choose a part</div>'+seg([[1,'Part 1'],[2,'Part 2'],[3,'Part 3']],'lvpart',cfg.part)+chips((cfg.part===1?SP1:SP2).map(x=>[x.id,x.t]),'lvtopic',cfg.tid)+(cand?'':'<div class="xs warn">Waiting for a candidate to join.</div>')+'<button class="btn pri block" data-a="lvbegin" '+(cand?'':'disabled')+'>Begin</button></div>';
  if(!st)return setup;
  if(st.ph==='wrap')return '<div class="card tc col g8"><div class="t2">Part '+st.part+' finished</div><p class="sm mut" style="margin:0">Score the candidate, or begin another part below.</p></div>'+setup;
  const qs=lvQs(st);
  if(st.part===2&&(st.ph==='prep'||st.ph==='talk')){
    const c=P2C(st.tid);
    return '<div class="card hero col g12"><div class="row between"><div class="eyebrow">'+(st.ph==='prep'?'Preparation':'Candidate speaking')+'</div><span class="pill gold">'+tm(rx||Date.now(),st.dur)+'</span></div><div class="cue sm">'+esc(c.cue)+'</div></div>'+(st.ph==='prep'?'<button class="btn pri block" data-a="lvtalk">Start the 2 minutes</button>':'<button class="btn block" data-a="lvstop">Stop, then ask follow-up questions</button>');
  }
  return '<div class="card hero col g12"><div class="eyebrow">Read this aloud</div><div class="t2" style="font-size:24px">'+esc(qs[st.qi])+'</div><div class="xs mut">Question '+(st.qi+1)+' of '+qs.length+'</div></div><div class="row g8"><button class="btn grow" data-a="lvend">End part</button><button class="btn pri grow" data-a="lvnext">'+(st.qi>=qs.length-1?'Finish part':'Next question')+'</button></div>';
}
function watcherView(lv,st,rx){
  if(!LIVE.peers.some(p=>p.presence&&p.presence.role==='examiner'))return '<div class="card tc sm dim">Waiting for an examiner to join.</div>';
  if(!st)return '<div class="card tc sm dim">Waiting for the examiner to begin.</div>';
  const isC=lv.role==='candidate';
  if(st.ph==='wrap')return '<div class="card tc col g8"><div class="t2">Part '+st.part+' finished</div>'+(isC?'<button class="btn pri" data-a="lvlog">Log this session</button>':'')+'</div>';
  const qs=lvQs(st);
  if(st.part===2&&(st.ph==='prep'||st.ph==='talk')){
    const c=P2C(st.tid);
    return '<div class="card hero tc col g8"><div class="eyebrow">'+(st.ph==='prep'?'Prepare':'Speak now')+'</div><div class="num" style="font-size:56px;line-height:1">'+tm(rx||Date.now(),st.dur)+'</div></div><div class="card"><div class="cue sm">'+esc(c.cue)+'</div></div>'+(isC&&st.ph==='prep'?'<textarea class="tarea" id="lv-notes" data-i="lvnotes" rows="3" placeholder="Key words only">'+esc(lv.notes)+'</textarea>':'');
  }
  const show=!isC||lv.show;
  return '<div class="card hero col g12"><div class="eyebrow">Part '+st.part+' · question '+(st.qi+1)+' of '+qs.length+'</div>'+(show?'<div class="t2" style="font-size:24px">'+esc(qs[st.qi])+'</div>':'<div class="sm mut">Listen to the examiner. Show the text only if you need it.</div>')+'</div>'+(isC&&!lv.show?'<button class="btn block" data-a="lvshow">Show the question</button>':'');
}

  '<div class="card col g12"><div class="field"><label class="lbl" for="nick">Display name</label><input class="inp" id="nick" data-c="nick" value="'+esc(m.nick||'')+'" placeholder="'+esc(S.me&&S.me.name||'Your name')+'" autocomplete="off"></div><div><label class="lbl">Theme</label>'+seg([['auto','Auto'],['dark','Dark'],['light','Light']],'theme',theme)+'</div><label class="row g12" style="cursor:pointer"><input type="checkbox" data-c="shareTog" '+(setting('share',true)?'checked':'')+' style="width:20px;height:20px;accent-color:var(--gold)"><span class="sm">Show my activity in the group feed</span></label></div>'+
  '<div class="card" style="padding:4px 16px"><div class="list">'+
  [['keys','key','Answer keys','Paste keys for Cambridge 19 and 20'],['audiolib','wave','Audio library','Import Listening mp3 files on this device'],['planSet','sliders','Plan settings','Start date, exam date, target band'],['export','download','Export my data','Save a JSON backup'],['install','phone','Install on your phone','Add this page to your home screen']].map(([a,i,t,s])=>'<div class="li" data-a="meact" data-v="'+a+'"><span class="ico">'+ic(i)+'</span><div class="grow"><div class="t3" style="font-size:14px">'+t+'</div><div class="xs dim">'+s+'</div></div>'+ic('right',16)+'</div>').join('')+'</div></div>'+
  '<div class="card soft xs mut">'+(cloud?'Your progress is saved to the shared study room. Private notes, drafts and flashcard history stay visible only to you.':'This page is not connected to a shared store here, so everything is saved on this device only.')+'<br><br>Not affiliated with Cambridge University Press &amp; Assessment or the IELTS partners. No book text or audio is included. Bring your own copies.</div></div>';
};
A.meact=d=>{const v=d.v;if(v==='keys'){S.v.key=S.v.key||{bk:'c20',t:1,m:'L',text:''};push('keys')}else if(v==='audiolib')push('audiolib');else if(v==='planSet')A.planSet();else if(v==='export')A.export();else if(v==='install')A.install()};
A.theme=d=>{ls.set('mdn_theme',d.v);applyTheme();render()};
I.nick=v=>save('members/'+S.uid,{nick:v.trim()});
I.shareTog=v=>save(myp('set'),{share:!!v});
A.install=()=>sheet('<div class="t2">Add to your home screen</div><div class="md mt16"><p><b>Android, Chrome:</b> open the menu (three dots), then <b>Add to Home screen</b> or <b>Install app</b>.</p><p><b>iPhone, Safari:</b> tap Share, then <b>Add to Home Screen</b>.</p><p>The shortcut opens this page like an app. It needs a connection, and local storage must be enabled.</p></div><button class="btn pri block mt16" data-a="closeSheet">Got it</button>');
A.export=async()=>{
  const dl=DB.dl;if(!dl)return toast('Export is not available in this view');
  const data={app:'Meridian',exported:new Date().toISOString(),member:me(),private:Object.fromEntries(Object.entries(S.docs).filter(([k])=>k.startsWith('data/users/'+S.uid+'/')))};
  try{await dl.save({filename:'meridian-backup-'+dkey()+'.json',data:JSON.stringify(data,null,1)});toast('Backup ready')}catch(e){if(!e||e.code!=='declined')toast('Could not save the file')}
};

/* main.js */
/* ===== boot ===== */
function afterDraw(){tickTimers()}
setInterval(tickTimers,500);
window.addEventListener('error',e=>{console.error('window error',e.message)});
async function boot(){
  applyTheme();wire();
  const h=location.hash.slice(1);if(TABS.includes(h))S.tab=h;
  render();
  try{await initBackend()}catch(e){console.error('backend',e);S.uid=S.uid||'local';S.ready=true;render()}
  liveInit();
}
boot();

</script>
